name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 is the minimum supported version.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # Real conversion tools for test_integration.py.  ont_fast5_api's pinned
      # progressbar33 no longer builds, and it imports pkg_resources (removed
      # from setuptools 81), so install it without dependencies.
      - name: Install conversion tools
        run: |
          python -m pip install progressbar2 packaging "setuptools<81"
          python -m pip install --no-deps ont_fast5_api
          single_to_multi_fast5 --help > /dev/null
          pod5 --help > /dev/null

      - name: Byte-compile scripts
        run: python -m compileall -q nanopore_format_checker.py nanopore_converter.py compress_folders.py

      - name: CLI smoke test
        run: |
          python nanopore_format_checker.py --help > /dev/null
          python nanopore_converter.py --help > /dev/null
          python compress_folders.py --help > /dev/null

      - name: Run tests
        run: python -m pytest test_optimizations.py test_nanopore_converter.py test_compress_folders.py test_integration.py -v -rs
